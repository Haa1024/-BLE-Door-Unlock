name: Build APK

# 触发条件: 推送到 main/master 分支、推送 v* 标签、手动触发 (Actions 页面按钮)
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17 (并缓存 Gradle 依赖)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 接受 Android SDK 许可 (缺失组件会被 AGP 自动下载)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      # 签名密钥三级兜底:
      #   1) GitHub Secrets 里的 KEYSTORE_BASE64 (推荐, 密钥不入库)
      #   2) 仓库中提交的 release.keystore (git add -f release.keystore, 方便但密钥公开)
      #   3) 都没有 → 现场生成临时密钥 (APK 可装可测, 但无法覆盖升级正式签名版)
      - name: 准备签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "已从 Secrets 解码签名密钥"
          elif [ -f release.keystore ]; then
            echo "使用仓库中提交的 release.keystore"
          else
            echo "警告: 未找到签名密钥, 生成临时密钥 (仅测试用)"
            keytool -genkeypair -v -keystore release.keystore -alias release \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=UnlockDoor, OU=Dev, O=Unlock, L=SH, ST=SH, C=CN"
          fi

      - name: 构建 Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 读取版本号
        id: ver
        run: echo "version=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      # 每次构建都会生成一个可下载的产物 (Actions 运行详情页底部)
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 住理生活门锁-${{ steps.ver.outputs.version }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # 推送 v* 标签时, APK 会自动发布到仓库 Releases 页面
      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
